name: sekechi_app
description: "سکه‌چی - پلتفرم بازی رومیزی آنلاین"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.0
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#673AB7"
  image: "assets/images/splash.png"
  android: true
  ios: true

flutter:
  uses-material-design: true


